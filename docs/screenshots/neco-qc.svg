<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">

<defs>
  <linearGradient id="bgGlow" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#081009"/>
    <stop offset=".48" stop-color="#070b08"/>
    <stop offset="1" stop-color="#050805"/>
  </linearGradient>
  <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
    <rect width="4" height="2" fill="transparent"/>
    <rect y="3" width="4" height="1" fill="#000" opacity=".22"/>
  </pattern>
  <pattern id="phosphor" width="3" height="3" patternUnits="userSpaceOnUse">
    <rect width="1" height="3" fill="#96ffa5" opacity=".018"/>
    <rect x="2" width="1" height="3" fill="#000" opacity=".03"/>
  </pattern>
  <filter id="glow">
    <feGaussianBlur stdDeviation="3" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="shadow" x="-20%" y="-20%" width="150%" height="150%">
    <feDropShadow dx="4" dy="4" stdDeviation="0" flood-color="#000" flood-opacity=".9"/>
  </filter>
</defs>

<rect width="1600" height="900" fill="url(#bgGlow)"/>
