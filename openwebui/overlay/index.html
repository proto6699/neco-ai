		<script>
			// On page load or when changing themes, best to add inline in `head` to avoid FOUC
			(() => {
				const metaThemeColorTag = document.querySelector('meta[name="theme-color"]');
				const prefersDarkTheme = window.matchMedia('(prefers-color-scheme: dark)').matches;

				if (!localStorage?.theme) {
					localStorage.theme = 'system';
				}

				if (localStorage.theme === 'system') {
					document.documentElement.classList.add(prefersDarkTheme ? 'dark' : 'light');
					metaThemeColorTag.setAttribute('content', prefersDarkTheme ? '#171717' : '#ffffff');
				} else if (localStorage.theme === 'oled-dark') {
					document.documentElement.style.setProperty('--color-gray-800', '#101010');
					document.documentElement.style.setProperty('--color-gray-850', '#050505');
					document.documentElement.style.setProperty('--color-gray-900', '#000000');
					document.documentElement.style.setProperty('--color-gray-950', '#000000');
					document.documentElement.classList.add('dark');
					metaThemeColorTag.setAttribute('content', '#000000');
				} else if (localStorage.theme === 'light') {
					document.documentElement.classList.add('light');
					metaThemeColorTag.setAttribute('content', '#ffffff');
				} else if (localStorage.theme === 'her') {
					document.documentElement.classList.add('her');
					metaThemeColorTag.setAttribute('content', '#983724');
				} else {
					document.documentElement.classList.add('dark');
					metaThemeColorTag.setAttribute('content', '#171717');
				}

				// LICENSE covers these Open WebUI splash logo assets.
				// Do not alter, remove, obscure, or replace them except as LICENSE permits:
				// https://docs.openwebui.com/license.
				const preloadHref = document.documentElement.classList.contains('dark')
					? '/static/splash-dark.png'
					: '/static/splash.png';
				const preload = document.createElement('link');
				preload.rel = 'preload';
				preload.as = 'image';
				preload.href = preloadHref;
				preload.setAttribute('fetchpriority', 'high');
				document.head.appendChild(preload);

				window.matchMedia('(prefers-color-scheme: dark)').addListener((e) => {
					if (localStorage.theme === 'system') {
						if (e.matches) {
							document.documentElement.classList.add('dark');
							document.documentElement.classList.remove('light');
							metaThemeColorTag.setAttribute('content', '#171717');
						} else {
							document.documentElement.classList.add('light');
							document.documentElement.classList.remove('dark');
							metaThemeColorTag.setAttribute('content', '#ffffff');
						}
					}
				});
				const isDarkMode = document.documentElement.classList.contains('dark');

				const logo = document.createElement('img');
				logo.id = 'logo';
				logo.style =
					'position: absolute; width: auto; height: 6rem; top: 44%; left: 50%; transform: translateX(-50%); display:block;';
				logo.loading = 'eager';
				logo.fetchPriority = 'high';
				// LICENSE covers this Open WebUI splash logo.
				// Do not alter, remove, obscure, or replace it except as LICENSE permits:
				// https://docs.openwebui.com/license.
				logo.src = isDarkMode ? '/static/splash-dark.png' : '/static/splash.png';

				document.addEventListener('DOMContentLoaded', function () {
					const splash = document.getElementById('splash-screen');
					if (document.documentElement.classList.contains('her')) {
						return;
					}

					if (splash) splash.prepend(logo);
				});
			})();
		</script>

<script id="den-assets">
(() => {
  // ON at every page load. The button can still pause this session.
  try {
    localStorage.setItem('den-music', 'on');
    const v = Number(localStorage.getItem('den-volume'));
    if (!Number.isFinite(v) || v <= 0) {
      localStorage.setItem('den-volume', '0.5');
    }
  } catch (_) {}

  const start = () => {
    const favicon = '/static/den-favicon.png?v=3';
    const neco = '/static/den-neco.png?v=3';

    const apply = () => {
      document.querySelectorAll('link[rel]').forEach(link => {
        const rel = link.rel.toLowerCase();
        if (rel === 'icon' || rel === 'shortcut icon' ||
            rel === 'apple-touch-icon') {
          if (link.getAttribute('href') !== favicon) {
            link.setAttribute('href', favicon);
            link.setAttribute('type', 'image/png');
            link.removeAttribute('sizes');
          }
        }
      });

      document.querySelectorAll('img').forEach(img => {
        const src = img.getAttribute('src') || '';
        const alt = img.getAttribute('alt') || '';
        const builtin = /\/(?:favicon(?:-[^/]*)?\.(?:png|svg|ico)|logo\.(?:png|svg)|splash(?:-dark)?\.png)(?:\?|$)/i.test(src);
        const branded = /^open\s?webui(?:\s+logo)?$/i.test(alt.trim());

        if ((builtin || branded) && src !== neco) {
          img.removeAttribute('srcset');
          img.setAttribute('src', neco);
          img.setAttribute('alt', 'Neco — the den');
          img.style.objectFit = 'contain';
        }
      });
    };

    apply();
    let pending = false;
    const observer = new MutationObserver(() => {
      if (pending) return;
      pending = true;
      requestAnimationFrame(() => {
        pending = false;
        apply();
      });
    });
    observer.observe(document.documentElement, {
      subtree: true,
      childList: true,
      attributes: true,
      attributeFilter: ['src', 'href']
    });
  };

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', start, {once: true});
  } else start();
})();
</script>

    function makeCanvas(id) {
        let el = document.getElementById(id);
        if (el) return el;

        c.height = 180;

        const frame = ctx.createImageData(c.width, c.height);

        function noise() {
            for (let i = 0; i < pixels.length; i += 4) {
                const r = Math.random();

                if (r > .958) {
                    const v = 95 + Math.random() * 135;

                    pixels[i]     = v * .55;
                    pixels[i + 1] = v;
                    pixels[i + 2] = v * .62;
                    pixels[i + 3] = 25 + Math.random() * 70;
                } else {
                    pixels[i] = 0;
                    pixels[i + 1] = 0;
                    pixels[i + 2] = 0;
                    pixels[i + 3] = 0;

                    opacity = .08 + Math.random() * .08;
                } else if (chance > .92) {
                    opacity = .010 + Math.random() * .018;
                } else {
                    opacity = Math.random() * .005;

                setTimeout(() => {
                    document.body.classList.remove(cls);

                next();
            }, wait);
        }

        next();
    }


    function syncTearLoop() {
        const tear = makeDiv("ech0-sync-tear");

        function next() {
            const wait = 4500 + Math.random() * 12000;

            setTimeout(() => {
                tear.style.top = (4 + Math.random() * 90) + "vh";
                tear.classList.remove("active");
                void tear.offsetWidth;
                tear.classList.add("active");
                next();
            }, wait);

        next();
    }

        makeDiv("ech0-scanlines");
        makeDiv("ech0-phosphor");

    const observer = new MutationObserver(() => {
        if (scheduled) return;
        scheduled = true;

        requestAnimationFrame(() => {
            scheduled = false;
            applyFixes();

<script id="den-script">
(() => {
  if (window.__denInstalled) return;
  window.__denInstalled = true;

  const boot = () => {
    const panel = document.createElement('div');
    panel.id = 'den-radio';
    panel.innerHTML = '<button type="button">DEN MUSIC OFF</button>';
    document.body.appendChild(panel);

    const button = panel.querySelector('button');
    const track = new Audio('/static/den-music.mp3');
    track.loop = true;
    track.volume = 0.5;
    track.preload = 'auto';
    let wanted = true;
    let audioFailed = false;

    const update = () => {
      button.textContent = audioFailed ? 'DEN MUSIC UNAVAILABLE' :
        (track.paused ? 'DEN MUSIC OFF' : 'DEN MUSIC ON');
      button.setAttribute('aria-pressed', String(!track.paused));
      button.setAttribute('aria-label',
        audioFailed ? 'Music unavailable. Add your MP3 with scripts/set-music.sh, then refresh.' :
        (track.paused ? 'Play Den music' : 'Pause Den music'));
    };

    const play = () => {
      button.title = 'Starting music…';
      track.play().then(() => {
        if (!wanted) track.pause();
        button.title = 'Click to turn music off';
        update();
      }).catch(error => {
        if (audioFailed) return;
        update();
        button.title = error.name === 'NotAllowedError'
          ? 'Click to start music; your browser requires a user gesture'
          : 'Audio could not play. Check that your file is a supported MP3.';
      });
    };

    button.addEventListener('click', () => {
      if (track.paused) {
        wanted = true;
        play();
      } else {
        wanted = false;
        track.pause();
      }
    });

    const unlock = event => {
      if (!audioFailed && !panel.contains(event.target) && wanted && track.paused) play();
    };
    document.addEventListener('click', unlock);
    document.addEventListener('keydown', unlock);
    track.addEventListener('playing', update);
    track.addEventListener('pause', update);
    track.addEventListener('error', () => {
      audioFailed = true;
      update();
      button.title = 'Music missing or unreadable. Run ./scripts/set-music.sh /path/to/song.mp3, then refresh.';
    });

    update();
    play();
  };

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', boot, {once:true});
  } else boot();
})();
</script>

<script id="neco-live-watch">
(() => {
    if (window.__NECO_LIVE_WATCH__) return;
    window.__NECO_LIVE_WATCH__ = true;

    const IDLE_SUFFIX = " — idle";
    const CHECK_EVERY = 5000;

    let chatId = null;
    let lastTip = null;
    let busy = false;

    function authHeaders() {
        const token =
            localStorage.getItem("token") ||
            localStorage.getItem("access_token");

        return token
            ? { Authorization: `Bearer ${token}` }
            : {};
    }

    async function findNecoChat() {
        try {
            const r = await fetch("/api/v1/chats/", {
                credentials: "include",
                headers: authHeaders()
            });

            if (!r.ok) return null;

            const chats = await r.json();

            // Any cat's idle chat: "<Name> — idle".
            const neco = chats.find(
                c => typeof c.title === "string" && c.title.endsWith(IDLE_SUFFIX)
            );

            return neco?.id || null;
        } catch (_) {
            return null;
        }
    }

    function currentlyViewing(id) {
        return (
            location.pathname.includes(id) ||
            location.href.includes(id)
        );
    }

    async function check() {
        if (busy) return;
        busy = true;

        try {
            if (!chatId) {
                chatId = await findNecoChat();
                if (!chatId) return;
            }

            if (!currentlyViewing(chatId))
                return;

            const r = await fetch(
                `/api/v1/chats/${chatId}`,
                {
                    credentials: "include",
                    headers: authHeaders()
                }
            );

            if (!r.ok) return;

            const data = await r.json();

            const tip =
                data?.chat?.history?.currentId;

            if (!tip) return;

            if (lastTip === null) {
                lastTip = tip;
                return;
            }

            if (tip !== lastTip) {
                lastTip = tip;

                /*
                 * Force SvelteKit to reconstruct only the
                 * currently-open chat route.
                 *
                 * This is not a full browser/page refresh.
                 */
                history.replaceState(
                    history.state,
                    "",
                    location.href
                );

                window.dispatchEvent(
                    new PopStateEvent("popstate")
                );
            }

        } catch (e) {
            console.debug(
                "Neco live watcher:",
                e
            );
        } finally {
            busy = false;
        }
    }

    setInterval(check, CHECK_EVERY);

    setTimeout(check, 1500);
})();
</script>
