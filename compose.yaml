services:
  openwebui:
    build:
      context: ./openwebui
    container_name: neco-ai-webui
    restart: unless-stopped
    ports:
      - "${OPENWEBUI_BIND:-127.0.0.1}:${OPENWEBUI_PORT:-3300}:8080"
    volumes:
      - neco-ai-webui-data:/app/backend/data
      - ./.runtime:/host-runtime:ro
    environment:
      WEBUI_SECRET_KEY: "${WEBUI_SECRET_KEY}"
      ENABLE_API_KEYS: "true"
      OLLAMA_BASE_URL: "http://host.docker.internal:11434"
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  neco-ai-webui-data:
